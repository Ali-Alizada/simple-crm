<h2 mat-dialog-title>Edit basic details</h2>

<div mat-dialog-content>
  <mat-form-field appearance="outline">
    <mat-label>First name</mat-label>
    <input matInput [(ngModel)]="user.firstName" [disabled]="saving">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Last name</mat-label>
    <input matInput [(ngModel)]="user.lastName" [disabled]="saving">
  </mat-form-field>

  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="saving">Cancel</button>
  <button mat-flat-button (click)="save()" [disabled]="saving">Save</button>
</div>
