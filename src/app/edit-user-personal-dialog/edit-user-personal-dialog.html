<mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
<h2 mat-dialog-title>Edit personal details</h2>

<div mat-dialog-content class="personal-dialog-container">
  <div class="personal-contact-container">
      <mat-form-field appearance="outline" class="">
        <mat-label>Personal e-mail</mat-label>
        <input [disabled]="loading" matInput type="email" [(ngModel)]="user.email" [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input [disabled]="loading" matInput type="tel" [(ngModel)]="user.phoneNumber" [disabled]="saving">
      </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="bDate-container">
    <mat-label>Birth date</mat-label>
    <input [disabled]="loading" matInput [matDatepicker]="birthPicker" [(ngModel)]="birthDate" [disabled]="saving">
    <mat-datepicker-toggle matIconSuffix [for]="birthPicker"></mat-datepicker-toggle>
    <mat-datepicker #birthPicker></mat-datepicker>
  </mat-form-field>

  <div class="personal-address-container">
    <mat-form-field appearance="outline">
    <mat-label>Street</mat-label>
    <input [disabled]="loading" matInput [(ngModel)]="user.street" [disabled]="saving">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>House number</mat-label>
    <input [disabled]="loading" matInput [(ngModel)]="user.houseNo" [disabled]="saving">
  </mat-form-field>
  </div>

  <div class="personal-address-container">
    <mat-form-field appearance="outline">
    <mat-label>ZIP code</mat-label>
    <input [disabled]="loading" matInput [(ngModel)]="user.zipCode" [disabled]="saving">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>City</mat-label>
    <input [disabled]="loading" matInput [(ngModel)]="user.city" [disabled]="saving">
  </mat-form-field>
  </div>

  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="saving">Cancel</button>
  <button mat-flat-button (click)="save()" [disabled]="saving">Save</button>
</div>
