<mat-progress-bar *ngIf="saving" mode="indeterminate"></mat-progress-bar>

<h2 mat-dialog-title>Add contact</h2>

<form #contactForm="ngForm" mat-dialog-content (ngSubmit)="saveUser()">
  <section class="form-section">
    <h3>Basic details</h3>
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>First name</mat-label>
        <input matInput name="firstName" [(ngModel)]="user.firstName" required [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last name</mat-label>
        <input matInput name="lastName" [(ngModel)]="user.lastName" required [disabled]="saving">
      </mat-form-field>
    </div>
  </section>

  <section class="form-section">
    <h3>Personal details</h3>
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Personal e-mail</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="user.email" [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput type="tel" name="phoneNumber" [(ngModel)]="user.phoneNumber" [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Birth date</mat-label>
        <input matInput name="birthDate" [matDatepicker]="birthPicker" [(ngModel)]="birthDate" [disabled]="saving">
        <mat-datepicker-toggle matIconSuffix [for]="birthPicker"></mat-datepicker-toggle>
        <mat-datepicker #birthPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Street</mat-label>
        <input matInput name="street" [(ngModel)]="user.street" [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>House number</mat-label>
        <input matInput name="houseNo" [(ngModel)]="user.houseNo" [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>ZIP code</mat-label>
        <input matInput name="zipCode" [(ngModel)]="user.zipCode" [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>City</mat-label>
        <input matInput name="city" [(ngModel)]="user.city" [disabled]="saving">
      </mat-form-field>
    </div>
  </section>

  <section class="form-section">
    <h3>Professional details</h3>
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Job title</mat-label>
        <input matInput name="jobTitle" [(ngModel)]="user.jobTitle" [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Company</mat-label>
        <input matInput name="company" [(ngModel)]="user.company" [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Department</mat-label>
        <input matInput name="department" [(ngModel)]="user.department" [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Work e-mail</mat-label>
        <input matInput type="email" name="workEmail" [(ngModel)]="user.workEmail" [disabled]="saving">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Work phone</mat-label>
        <input matInput type="tel" name="workPhone" [(ngModel)]="user.workPhone" [disabled]="saving">
      </mat-form-field>
    </div>
  </section>

  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
</form>

<div mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()" [disabled]="saving">Cancel</button>
  <button
    mat-flat-button
    cdkFocusInitial
    [disabled]="saving || contactForm.invalid"
    (click)="saveUser()"
  >
    {{ saving ? 'Saving...' : 'Save contact' }}
  </button>
</div>
