
<div mat-dialog-content>
  <h1 mat-dialog-title>Add User</h1>
  <!-- <p>Add new User</p> -->

  <div class="form-name-container">
    <mat-form-field appearance="outline">
      <mat-label>First Name</mat-label>
      <input matInput placeholder="your name gose here">
      <!-- <mat-icon matSuffix>sentiment_very_satisfied</mat-icon> -->
      <!-- <mat-hint>Please enter a name</mat-hint> -->
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Last Name</mat-label>
      <input matInput placeholder="your name gose here">
      <!-- <mat-icon matSuffix>sentiment_very_satisfied</mat-icon> -->
      <!-- <mat-hint>Please enter a name</mat-hint> -->
    </mat-form-field>

  </div>

  <div>
      <mat-form-field appearance="outline" class="form-date-container">
        <mat-label>Birth Date</mat-label>
        <input matInput placeholder="your birth date" [matDatepicker]="picker1">
        <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
        <mat-datepicker #picker1></mat-datepicker>
        <!-- <mat-hint>Please enter a name</mat-hint> -->
      </mat-form-field>
  </div>

  <div class="adressA">
    <div>
          <mat-form-field appearance="outline" class="form-adressOne-container">
          <mat-label>Street</mat-label>
          <input matInput placeholder="your street name">
          <!-- <mat-hint>Please enter a name</mat-hint> -->
        </mat-form-field>
    </div>

    <div>
          <mat-form-field appearance="outline" class="form-adressTow-container">
          <mat-label>Hose No.</mat-label>
          <input matInput placeholder="your hose No.">
          <!-- <mat-hint>Please enter a name</mat-hint> -->
        </mat-form-field>
    </div>
  </div>

  <div class="adressB">
      <div>
        <mat-form-field appearance="outline" class="adressThree-container">
        <mat-label>Zip Code</mat-label>
        <input matInput placeholder="your zip code">
        <!-- <mat-hint>Please enter a name</mat-hint> -->
        </mat-form-field>
    </div>

    <div>
          <mat-form-field appearance="outline">
          <mat-label>City</mat-label>
          <input matInput placeholder="your city name">
          <!-- <mat-hint>Please enter a name</mat-hint> -->
        </mat-form-field>
    </div>
  </div>





</div>
<div class="dialog-btns" mat-dialog-actions>
  <button mat-button>Cancel</button>
  <button mat-button cdkFocusInitial>Save</button>
</div>
