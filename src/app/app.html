

<mat-drawer-container class="mat-drawer-container" autosize>
  <mat-drawer #drawer class="sidenav" [opened]="true" mode="side">
    <div class="logo-container">
      Logo platzhalter
    </div>

    <ul>
      <li>
        <img src="./assets/icons/dashboard-icon-.png" alt="Dashboard-icon von: Kharisma">
        Dashboard</li>
      <li>
        <img src="./assets/icons/benutzer.png" alt="user-icon">
        User
      </li>
    </ul>

  </mat-drawer>

<mat-toolbar>
  <mat-toolbar-row>
    <mat-icon class="menu-icon" (click)="drawer.toggle()">menu</mat-icon>
    <span>Simple CRM</span>
  </mat-toolbar-row>
</mat-toolbar>






</mat-drawer-container>
